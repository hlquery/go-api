name: Go API

on:
  push:
    paths:
      - ".github/workflows/go-api.yml"
      - "**"
  pull_request:
    paths:
      - ".github/workflows/go-api.yml"
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # These workflow files are copied into standalone repos by etc/scripts/hl.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: ./go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build examples
        run: |
          for dir in examples/*; do
            if [ -d "$dir" ]; then
              go build "./$dir"
            fi
          done
